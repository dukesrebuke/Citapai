[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
```


- `publish = "."` tells Netlify that your site files are in the root directory
- The redirect rule ensures your SPA routing works properly
- Functions are already correctly configured

