<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Citapai — Citas en Medellín</title>
<meta name="description" content="Tu generador de ideas de citas en Medellín, curado por IA." />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />

<script defer src="/assets/app.bundle.js"></script>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ── Dark mode — Bosque Nocturno ── */
:root[data-theme="dark"] {
  --bg:            #0d2218;
  --bg-card:       #12301f;
  --bg-pill:       rgba(144,200,100,0.04);
  --border:        rgba(144,200,144,0.10);
  --border-strong: rgba(144,200,144,0.18);
  --text:          #e8f0e2;
  --text-dim:      rgba(232,240,226,0.55);
  --text-faint:    rgba(232,240,226,0.26);
  --topbar-bg:     rgba(13,34,24,0.85);
  --shadow:        0 8px 40px rgba(0,0,0,0.5);
  --toast-bg:      #1a3a2a;
}

/* ── Light mode — Tarde de Primavera ── */
:root[data-theme="light"] {
  --bg:            #f4f8f0;
  --bg-card:       #ffffff;
  --bg-pill:       rgba(0,0,0,0.03);
  --border:        rgba(26,58,42,0.12);
  --border-strong: rgba(26,58,42,0.20);
  --text:          #0d2218;
  --text-dim:      rgba(13,34,24,0.58);
  --text-faint:    rgba(13,34,24,0.32);
  --topbar-bg:     rgba(244,248,240,0.90);
  --shadow:        0 4px 24px rgba(13,34,24,0.10);
  --toast-bg:      #0d2218;
}

/* ── Shared tokens ── */
:root {
  --bloom:      #9b4f8e;
  --bloom-hot:  #b45fa6;
  --bloom-dim:  rgba(155,79,142,0.10);
  --bloom-glow: rgba(155,79,142,0.24);
  --gold:       #e8a020;
}

html, body {
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'Cormorant Garamond', Georgia, serif;
  overflow-x: hidden;
  transition: background 0.25s, color 0.25s;
}

/* Grain — dark only */
:root[data-theme="dark"] body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
  opacity: 0.03;
  pointer-events: none;
  z-index: 9000;
}

#root {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 0 80px 0;
}

/* ── Topbar ── */
.topbar {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 40px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 48px;
  background: var(--topbar-bg);
  backdrop-filter: blur(14px);
  position: sticky;
  top: 0;
  z-index: 100;
  transition: background 0.25s, border-color 0.25s;
}
.logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.3rem;
  letter-spacing: 0.16em;
  color: var(--text);
  text-decoration: none;
  transition: color 0.25s;
}
.logo span { color: var(--bloom); }
.topbar-right {
  display: flex;
  gap: 16px;
  align-items: center;
}
.topbar-btn {
  background: none;
  border: none;
  cursor: pointer;
  font-family: 'DM Mono', monospace;
  font-size: 0.6rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--text-faint);
  transition: color 0.2s;
  padding: 0;
}
.topbar-btn:hover { color: var(--bloom); }
.topbar-btn.active { color: var(--bloom); }

/* Lang toggle */
.lang-toggle {
  background: none;
  border: 1px solid var(--border-strong);
  cursor: pointer;
  font-family: 'DM Mono', monospace;
  font-size: 0.58rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--text-faint);
  padding: 4px 10px;
  border-radius: 2px;
  transition: all 0.2s;
}
.lang-toggle:hover { color: var(--bloom); border-color: var(--bloom); }

/* Theme toggle */
.theme-toggle {
  background: none;
  border: 1px solid var(--border-strong);
  cursor: pointer;
  width: 32px;
  height: 18px;
  border-radius: 9px;
  position: relative;
  transition: border-color 0.2s;
  flex-shrink: 0;
}
.theme-toggle::after {
  content: '';
  position: absolute;
  top: 2px;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--text-faint);
  transition: left 0.2s, background 0.2s;
}
:root[data-theme="dark"]  .theme-toggle::after { left: 2px; }
:root[data-theme="light"] .theme-toggle::after { left: 16px; background: var(--bloom); }

/* ── App shell ── */
.app-shell {
  width: 100%;
  max-width: 560px;
  padding: 0 24px;
}

/* ── Section label ── */
.section-label {
  font-family: 'DM Mono', monospace;
  font-size: 0.6rem;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--text-faint);
  margin-bottom: 14px;
}

/* ── Filter group ── */
.filter-group { margin-bottom: 34px; }

/* ── Pills ── */
.pill-row { display: flex; flex-wrap: wrap; gap: 8px; }
.pill {
  font-family: 'DM Mono', monospace;
  font-size: 0.65rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 9px 18px;
  border: 1px solid var(--border-strong);
  background: var(--bg-pill);
  color: var(--text-dim);
  cursor: pointer;
  transition: all 0.18s;
  outline: none;
  border-radius: 2px;
}
.pill:hover {
  border-color: var(--bloom);
  color: var(--text);
  background: var(--bloom-dim);
}
.pill.active {
  border-color: var(--bloom);
  background: var(--bloom-dim);
  color: var(--bloom);
  font-weight: 500;
}

/* ── Generate button ── */
.btn-generate {
  width: 100%;
  padding: 20px;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.15rem;
  letter-spacing: 0.22em;
  background: var(--bloom);
  color: #fff;
  border: none;
  cursor: pointer;
  transition: all 0.2s;
  margin-top: 8px;
  box-shadow: 0 4px 20px var(--bloom-glow);
  border-radius: 2px;
}
.btn-generate:hover:not(:disabled) {
  background: var(--bloom-hot);
  box-shadow: 0 6px 28px rgba(155,79,142,0.4);
  transform: translateY(-1px);
}
.btn-generate:disabled {
  background: var(--border-strong);
  color: var(--text-faint);
  cursor: not-allowed;
  box-shadow: none;
  transform: none;
}

/* ── Result card ── */
.result-card {
  border: 1px solid var(--border-strong);
  background: var(--bg-card);
  padding: 36px 40px;
  position: relative;
  overflow: hidden;
  box-shadow: var(--shadow);
  border-radius: 2px;
  transition: background 0.25s, border-color 0.25s;
}
.result-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: var(--bloom);
}
.result-neighborhood {
  font-family: 'DM Mono', monospace;
  font-size: 0.6rem;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--bloom);
  margin-bottom: 10px;
}
.result-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 2.8rem;
  letter-spacing: 0.03em;
  color: var(--text);
  line-height: 1;
  margin-bottom: 18px;
  transition: color 0.25s;
}
.result-description {
  font-size: 1.15rem;
  font-style: italic;
  font-weight: 300;
  color: var(--text-dim);
  line-height: 1.75;
  margin-bottom: 24px;
}
.pro-tip {
  background: var(--bloom-dim);
  border-left: 3px solid var(--bloom);
  padding: 13px 16px;
  margin-bottom: 24px;
  font-size: 0.95rem;
  font-style: italic;
  color: var(--text-dim);
  line-height: 1.6;
}
.pro-tip strong {
  font-family: 'DM Mono', monospace;
  font-size: 0.55rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--bloom);
  font-style: normal;
  display: block;
  margin-bottom: 5px;
}
.result-meta {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
  margin-bottom: 28px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
}
.meta-item label {
  font-family: 'DM Mono', monospace;
  font-size: 0.55rem;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--text-faint);
  display: block;
  margin-bottom: 4px;
}
.meta-item span {
  font-size: 0.95rem;
  color: var(--text-dim);
}
.result-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.btn-action {
  font-family: 'DM Mono', monospace;
  font-size: 0.6rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  padding: 11px 18px;
  border: 1px solid var(--border-strong);
  background: transparent;
  color: var(--text-dim);
  cursor: pointer;
  transition: all 0.18s;
  text-decoration: none;
  display: inline-block;
  border-radius: 2px;
}
.btn-action:hover { border-color: var(--text-dim); color: var(--text); }
.btn-action.primary { border-color: var(--bloom); color: var(--bloom); }
.btn-action.primary:hover { background: var(--bloom-dim); color: var(--bloom-hot); }
.btn-action.saved { border-color: rgba(60,190,90,0.45); color: rgba(60,190,90,0.85); cursor: default; }
.btn-action:disabled { opacity: 0.4; cursor: default; }

/* ── Citation box ── */
.citation-box {
  margin-top: 20px;
  padding: 10px 14px;
  background: var(--bg-pill);
  border: 1px solid var(--border);
  border-radius: 2px;
}
.citation-box p {
  font-family: 'DM Mono', monospace;
  font-size: 0.55rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--text-faint);
  margin-bottom: 4px;
}
.citation-box a {
  font-family: 'DM Mono', monospace;
  font-size: 0.6rem;
  color: var(--bloom);
  text-decoration: none;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  display: block;
}
.citation-box a:hover { text-decoration: underline; }

/* ── Saved drawer ── */
.saved-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
}
.saved-header h3 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.1rem;
  letter-spacing: 0.1em;
  color: var(--text);
}
.saved-count {
  font-family: 'DM Mono', monospace;
  font-size: 0.58rem;
  letter-spacing: 0.2em;
  color: var(--text-faint);
}
.saved-item {
  border: 1px solid var(--border);
  background: var(--bg-card);
  padding: 18px 22px;
  margin-bottom: 8px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 14px;
  transition: border-color 0.2s;
  border-radius: 2px;
}
.saved-item:hover { border-color: var(--border-strong); }
.saved-item-info { flex: 1; min-width: 0; }
.saved-item-neighborhood {
  font-family: 'DM Mono', monospace;
  font-size: 0.55rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--bloom);
  margin-bottom: 3px;
}
.saved-item-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.25rem;
  letter-spacing: 0.03em;
  color: var(--text);
  line-height: 1;
  margin-bottom: 5px;
}
.saved-item-desc {
  font-size: 0.85rem;
  font-style: italic;
  color: var(--text-faint);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.saved-item-actions {
  display: flex;
  gap: 6px;
  flex-shrink: 0;
  align-items: center;
}
.icon-btn {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--text-faint);
  font-family: 'DM Mono', monospace;
  font-size: 0.58rem;
  letter-spacing: 0.08em;
  padding: 4px 6px;
  transition: color 0.18s;
  text-decoration: none;
  display: inline-block;
}
.icon-btn:hover { color: var(--text); }
.icon-btn.danger:hover { color: var(--bloom); }

/* ── Divider ── */
.rule { width: 100%; height: 1px; background: var(--border); margin: 40px 0; }

/* ── Toast ── */
.toast {
  position: fixed;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%) translateY(16px);
  background: var(--toast-bg);
  border: 1px solid var(--border-strong);
  color: #e8f0e2;
  font-family: 'DM Mono', monospace;
  font-size: 0.62rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  padding: 11px 22px;
  opacity: 0;
  transition: all 0.28s;
  pointer-events: none;
  z-index: 999;
  border-radius: 2px;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── Error ── */
.error-msg {
  font-family: 'DM Mono', monospace;
  font-size: 0.62rem;
  letter-spacing: 0.1em;
  color: var(--bloom);
  margin-top: 18px;
  text-align: center;
}

/* ── Empty state ── */
.empty-italic { font-style: italic; color: var(--text-faint); font-size: 0.95rem; }

@media (max-width: 520px) {
  .topbar { padding: 14px 18px; }
  .result-card { padding: 26px 20px; }
  .result-title { font-size: 2.1rem; }
  .result-meta { grid-template-columns: 1fr; gap: 14px; }
  .result-actions { flex-direction: column; }
  .btn-action { text-align: center; }
}
</style>
</head>

<body>
<div id="root"></div>

</body>
</html>
