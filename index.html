<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="app-title-tag">Citapai</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary': '#009688', // Teal/Paisa-friendly color
                        'secondary': '#80CBC4',
                        'background': '#F4F4F9',
                        'card': '#FFFFFF',
                        'text-dark': '#212121',
                        'text-light': '#424242',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        
        /* Custom styles for subtle aesthetic touches */
        .card-glow {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.06), 0 0 10px rgba(0, 150, 136, 0.15);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        /* Custom radio button styling */
        .custom-radio-label {
            transition: all 0.3s ease;
            cursor: pointer;
            border: 2px solid #E0E0E0;
            color: var(--text-dark);
        }
        .custom-radio-input:checked + .custom-radio-label {
            border-color: #009688;
            background-color: #E0F2F1; /* Light teal background */
            box-shadow: 0 0 5px rgba(0, 150, 136, 0.5);
            font-weight: 600;
        }
        .custom-radio-input {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }

        /* Loading Spinner */
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-left-color: #009688;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Language Toggle Active State */
        .lang-switch.active {
            background-color: #009688;
            color: #FFFFFF;
            box-shadow: 0 2px 5px rgba(0, 150, 136, 0.4);
        }
        .lang-switch:not(.active) {
            background-color: transparent;
            color: #212121;
        }
        
        /* Map specific styles */
        #map-iframe {
            border-radius: 8px;
            width: 100%;
            height: 250px;
            border: 1px solid #ccc;
            margin-top: 10px;
        }

        /* Logo specific styling */
        .logo-img {
            width: 72px; /* Slightly larger for image */
            height: 72px;
            object-fit: contain;
        }
    </style>
</head>

        /**
         * Parses the model's text response (key-value format) into a structured object.
         */
        function parseModelResponse(text) {
            const data = {};
            const lines = text.split('\n').filter(line => line.trim() !== '');

            lines.forEach(line => {
                const [key, ...valueParts] = line.split(':');
                if (key && valueParts.length > 0) {
                    const cleanKey = key.trim();
                    const value = valueParts.join(':').trim();
                    data[cleanKey] = value;
                }
            });
            return data;
        }

        // Utility to implement exponential backoff for retries
        async function fetchWithBackoff(url, options, maxRetries = 5) {
             for (let i = 0; i < maxRetries; i++) { 
                try {
                    const response = await fetch(url, options);
                    if (response.status !== 429) { 
                        return response;
                    } 
                    const delay = Math.pow(2, i) * 1000 + (Math.random() * 1000); 
                    await new Promise(resolve => setTimeout(resolve, delay));
                } catch (error) { 
                    const delay = Math.pow(2, i) * 1000 + (Math.random() * 1000);
                    await new Promise(resolve => setTimeout(resolve, delay));
                    if (i === maxRetries - 1) throw error; 
                }
            }
            throw new Error("Max retries exceeded.");
        }

        /**
         * Handles the form submission and initiates the API call.
         */
        async function handleGenerate(event) {
            if (event) { event.preventDefault(); }
            const translations = TRANSLATIONS[currentLang];

            // --- 1. Get User Preferences ---
            const type = form.elements['date-type'].value;
            const timeOfDay = form.elements['time-of-day'].value;
            const atmosphere = form.elements.atmosphere.value;
            const price = form.elements.price.value;

            // --- Construct Query for the "Golden Nugget" Prompt ---
            const userQuery = `Generate a unique date idea for Medellín with the following criteria: Type: ${type}, Time of Day: ${timeOfDay}, Atmosphere: ${atmosphere}, Price: ${price}. Provide location, hours, best time to go, and crowd occupancy estimate. Respond fully in ${currentLang === 'es' ? 'Latin American Spanish' : 'English'}.`;

            // --- 2. UI State: Loading ---
            resultsContainer.classList.add('hidden'); // Hide old results
            mapLinkContainer.classList.add('hidden'); // Hide old link
            loadingIndicator.classList.remove('hidden'); 
            
            generateButton.disabled = true;
            shuffleButton.disabled = true;
            shuffleButton.classList.add('hidden'); 
            
            // Update button text and icon
            buttonText.textContent = translations['button-text-loading'];
            buttonIcon.classList.add('animate-spin');

            // --- 3. Construct API Payload (Gemini) ---
            const systemPrompt = getSystemPrompt();
            const payload = {
                contents: [{ parts: [{ text: userQuery }] }],
                tools: [{ "google_search": {} }],
                systemInstruction: { parts: [{ text: systemPrompt }] },
            };

            let responseData;
            let citationSources = [];

            try {
               const response = await fetchWithBackoff(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
        contents: [
            {
                role: "user",
                parts: [
                    { text: userQuery }
                ]
            }
        ]
    })
});

                if (!response.ok) {
                    throw new Error(`API request failed with status ${response.status}`);
                }
                const result = await response.json();
                const candidate = result.candidates?.[0];

                if (result.promptFeedback && result.promptFeedback.blockReason) {
                    throw new Error(`Content Blocked: ${result.promptFeedback.blockReason}`);
                }
                
                const groundingMetadata = candidate.groundingMetadata;
                if (groundingMetadata && groundingMetadata.groundingAttributions) {
                    citationSources = groundingMetadata.groundingAttributions
                        .map(attribution => ({
                            uri: attribution.web?.uri,
                            title: attribution.web?.title,
                        }))
                        .filter(source => source.uri && source.title); 
                }
                
                const rawText = candidate.content.parts[0].text;
                responseData = parseModelResponse(rawText);

                if (!responseData.Title || !responseData.Location) {
                     throw new Error(`Model returned unexpected format. Text starts with: ${rawText.substring(0, 50)}...`);
                }

            } catch (error) {
                console.error("API Error:", error);
                
                const errorMessage = (error.message.includes('400') || error.message.includes('403') || error.message.includes('401')) 
                    ? translations['error-key-desc'] 
                    : translations['error-generic-desc'];

                ideaTitle.textContent = translations['error-api-title'];
                locationText.textContent = errorMessage;
                descriptionText.textContent = '';
                hoursText.textContent = '';
                bestTimeText.textContent = '';
                occupancyText.textContent = '';
                citationBox.classList.add('hidden');
                
            } finally {
                // --- 4. UI State: Completed ---
                loadingIndicator.classList.add('hidden');
                generateButton.disabled = false;
                shuffleButton.disabled = false;
                // Only show shuffle button if results were successfully generated before
                if (responseData) {
                    shuffleButton.classList.remove('hidden'); 
                }
                buttonText.textContent = translations['button-text-default'];
                buttonIcon.classList.remove('animate-spin');
            }

            // --- 5. Populate Results (Only runs on successful try block) ---
            if (responseData) {
                ideaTitle.textContent = responseData.Title || 'N/A';
                locationText.textContent = responseData.Location || 'N/A';
                descriptionText.textContent = responseData.Description || 'N/A';
                hoursText.textContent = responseData.Hours || 'N/A';
                bestTimeText.textContent = responseData.BestTime || 'N/A';
                occupancyText.textContent = responseData.Occupancy || 'N/A';

                // Handle Map Display (Embed + Fallback Link)
                updateMapDisplay(responseData.MapQuery);

                // Handle citation display
                if (citationSources.length > 0) {
                    const source = citationSources[0];
                    citationLink.href = source.uri;
                    citationLink.textContent = source.title || source.uri;
                    citationBox.classList.remove('hidden');
                } else {
                    citationBox.classList.add('hidden');
                }
                
                // Show the results
                resultsContainer.classList.remove('hidden');
            }
        }
