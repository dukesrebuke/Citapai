/**
* Parses the model's text response (key-value format) into a structured object.
*/
function parseModelResponse(text) {
const data = {};
const lines = text.split('\n').filter(line => line.trim() !== '');

lines.forEach(line => {
const [rawKey, ...valueParts] = line.split(':');
if (!rawKey || valueParts.length === 0) return;
const key = rawKey.trim().toLowerCase();
const value = valueParts.join(':').trim();
if (key.startsWith('title')) data.Title = value;
else if (key.startsWith('location')) data.Location = value;
else if (key.startsWith('map')) data.MapQuery = value;
else if (key.startsWith('description')) data.Description = value;
else if (key.startsWith('hours')) data.Hours = value;
else if (key.includes('best')) data.BestTime = value;
else if (key.includes('occup') || key.includes('crowd')) data.Occupancy = value;
});
console.log("Parsed Model Data:", data);
return data;
}

// Utility to implement exponential backoff for retries
async function fetchWithBackoff(url, options, maxRetries = 5) {
for (let i = 0; i < maxRetries; i++) {
try {
const response = await fetch(url, options);
if (response.status !== 429) {
return response;
}
const delay = Math.pow(2, i) * 1000 + (Math.random() * 1000);
await new Promise(resolve => setTimeout(resolve, delay));
} catch (error) {
const delay = Math.pow(2, i) * 1000 + (Math.random() * 1000);
await new Promise(resolve => setTimeout(resolve, delay));
if (i === maxRetries - 1) throw error;
}
}
throw new Error("Max retries exceeded.");
}


/**

const isValid = mapQuery && mapQuery.trim() !== '';

return;
}

const searchUrl =
`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(mapQuery)}`;

/**
* Handles the form submission and initiates the API call.
*/
async function handleGenerate(event) {
if (event) { event.preventDefault(); }
const translations = TRANSLATIONS[currentLang];

// --- 1. Get User Preferences ---
const type = form.elements['date-type'].value;
const timeOfDay = form.elements['time-of-day'].value;
const atmosphere = form.elements.atmosphere.value;
const price = form.elements.price.value;

// --- Construct Query for the "Golden Nugget" Prompt ---
const userQuery = `Generate a unique date idea for Medellín with the following criteria: Type: ${type}, Time of Day: ${timeOfDay}, Atmosphere: ${atmosphere}, Price: ${price}. Provide location, hours, best time to go, and crowd occupancy estimate. Respond fully in ${currentLang === 'es' ? 'Latin American Spanish' : 'English'}.`;

// --- 2. UI State: Loading ---
resultsContainer.classList.add('hidden'); // Hide old results
mapLinkContainer.classList.add('hidden'); // Hide old link
loadingIndicator.classList.remove('hidden');

generateButton.disabled = true;
shuffleButton.disabled = true;
shuffleButton.classList.add('hidden');

// Update button text and icon
buttonText.textContent = translations['button-text-loading'];
buttonIcon.classList.add('animate-spin');

// --- 3. Construct API Payload (Gemini) ---
const systemPrompt = getSystemPrompt();
const payload = {
contents: [{ parts: [{ text: userQuery }] }],
tools: [{ "google_search": {} }],
systemInstruction: { parts: [{ text: systemPrompt }] },
};

let responseData;
let citationSources = [];

try {
const response = await fetch("/.netlify/functions/generate", {
method: "POST",
headers: { "Content-Type": "application/json" },
body: JSON.stringify({
userQuery,
systemPrompt
})
});



if (!response.ok) {
throw new Error(`API request failed with status ${response.status}`);
}
const result = await response.json();
const candidate = result.candidates?.[0];

if (result.promptFeedback && result.promptFeedback.blockReason) {
throw new Error(`Content Blocked: ${result.promptFeedback.blockReason}`);
}

const groundingMetadata = candidate.groundingMetadata;
if (groundingMetadata && groundingMetadata.groundingAttributions) {
citationSources = groundingMetadata.groundingAttributions
.map(attribution => ({
uri: attribution.web?.uri,
title: attribution.web?.title,
}))
.filter(source => source.uri && source.title);
}

const rawText = candidate.content.parts[0].text;
console.log("=== RAW API RESPONSE ===");
console.log(rawText);
console.log("=== END RAW RESPONSE ===");
responseData = parseModelResponse(rawText);

if (!responseData.Title || !responseData.Location) {
throw new Error(`Model returned unexpected format. Text starts with: ${rawText.substring(0, 50)}...`);
}

} catch (error) {
console.error("API Error:", error);

const errorMessage = (error.message.includes('400') || error.message.includes('403') || error.message.includes('401'))
? translations['error-key-desc']
: translations['error-generic-desc'];

ideaTitle.textContent = translations['error-api-title'];
locationText.textContent = errorMessage;
descriptionText.textContent = '';
hoursText.textContent = '';
bestTimeText.textContent = '';
occupancyText.textContent = '';
citationBox.classList.add('hidden');

} finally {
// --- 4. UI State: Completed ---
loadingIndicator.classList.add('hidden');
generateButton.disabled = false;
shuffleButton.disabled = false;
// Only show shuffle button if results were successfully generated before
if (responseData) {
shuffleButton.classList.remove('hidden');
}
buttonText.textContent = translations['button-text-default'];
buttonIcon.classList.remove('animate-spin');
}

// --- 5. Populate Results (Only runs on successful try block) ---
if (responseData) {
ideaTitle.textContent = responseData.Title || 'Unknown Place';
locationText.textContent = responseData.Location || 'Location unavailable';
descriptionText.textContent = responseData.Description || 'Description not available';
hoursText.textContent = responseData.Hours || 'Hours not specified';
bestTimeText.textContent = responseData.BestTime || 'No specific time recommended';
occupancyText.textContent = responseData.Occupancy || 'Unknown';

// Handle Map Display (Embed + Fallback Link)
updateMapDisplay(responseData.MapQuery);

// Handle citation display
if (citationSources.length > 0) {
const source = citationSources[0];
citationLink.href = source.uri;
citationLink.textContent = source.title || source.uri;
citationBox.classList.remove('hidden');
} else {
citationBox.classList.add('hidden');
}

// Show the results
resultsContainer.classList.remove('hidden');
}
}
